base_images:
build_root:
  from_repository: true
releases:
  initial:
    candidate:
      product: ocp
      stream: nightly
      version: "4.20"
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.20"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-oidc-serial
  cron: '@daily'
  steps:
    cluster_profile: gcp
    env:
      FEATURE_SET: TechPreviewNoUpgrade
      TEST_SUITE: openshift/conformance/serial
    workflow: openshift-e2e-gcp-csi-custom-worker
zz_generated_metadata:
  branch: release-4.20
  org: openshift
  repo: cluster-authentication-operator
  variant: periodics
